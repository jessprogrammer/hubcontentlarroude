<style>
/* Layout: mind map — skill at the centre, 9 coloured branches on a ring joined by curves; clicking a branch opens its expandable detail cards below. "Ver tudo" turns the map into a full outline. */
:root{
  --bg:#FFFFFF; --ink:#111111; --soft:#F2F2F2; --soft2:#E8E8E8; --muted:#5E5E5E; --line:#D9D9D9;
  --rosa:#E9519E; --vermelho:#D11524; --lilas:#A685DB; --azul:#2464AB; --acento:#F44C7F; --verde:#1E8A55; --laranja:#E0702A;
  --f:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E0E0E;--ink:#F5F5F5;--soft:#1C1C1C;--soft2:#262626;--muted:#B0B0B0;--line:#333333;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E0E;--ink:#F5F5F5;--soft:#1C1C1C;--soft2:#262626;--muted:#B0B0B0;--line:#333333;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 80px;display:grid;gap:20px}
h1,h2,h3,p{margin:0} h1,h2{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.tag{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wm{font-weight:800;letter-spacing:-.02em}
.wm .e{position:relative;display:inline-block}
.wm .e::after{content:"";position:absolute;left:50%;top:-.14em;width:.34em;height:.13em;background:var(--acento);border-radius:2px;transform:rotate(-24deg)}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.top h1{font-weight:900;font-stretch:115%;text-transform:uppercase;font-size:clamp(34px,5.6vw,72px);line-height:.92;letter-spacing:-.02em}
.top h1 span{color:var(--rosa)}
.top p{color:var(--muted);max-width:46ch;margin-top:10px}
.modes{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
.modes button{border:0;background:transparent;border-radius:999px;padding:10px 18px;font-weight:900;text-transform:uppercase;font-size:14px}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* map */
.map{position:relative;width:100%;aspect-ratio:16/9.2;background:var(--soft);border-radius:28px;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map path{fill:none;stroke-width:3;stroke-linecap:round;opacity:.55;transition:opacity .2s,stroke-width .2s}
.map path.on{opacity:1;stroke-width:5}
.root{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);border-radius:26px;padding:18px 22px;text-align:center;display:grid;gap:4px;width:min(250px,26%);z-index:2}
.root b{font-weight:900;font-stretch:112%;text-transform:uppercase;font-size:clamp(16px,1.9vw,24px);line-height:1}
.root small{font-size:13px;opacity:.75}
.node{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:20px;padding:12px 16px;color:#fff;text-align:left;display:grid;gap:2px;width:min(210px,19%);z-index:2;transition:transform .15s,box-shadow .15s}
.node:hover{transform:translate(-50%,-50%) scale(1.04)}
.node .n{font-weight:900;font-size:12px;letter-spacing:.1em;opacity:.85}
.node .t{font-weight:900;font-size:clamp(14px,1.45vw,19px);line-height:1.05;text-transform:uppercase}
.node .c{font-size:12px;opacity:.9}
.node[aria-pressed="true"]{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--ink)}
.hint{position:absolute;left:16px;bottom:14px;font-size:13px;font-weight:700;color:var(--muted)}

/* stacked branches (phone) */
.stack{display:none;gap:8px;grid-template-columns:1fr 1fr}
.stack .node{position:static;transform:none;width:auto}
.stack .node:hover{transform:none}

/* detail */
.detail{border-radius:28px;padding:clamp(18px,3vw,30px);display:grid;gap:18px;color:#fff}
.detail .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.detail h2{font-weight:900;font-stretch:115%;text-transform:uppercase;font-size:clamp(30px,4.4vw,56px);line-height:.92;letter-spacing:-.015em}
.detail .lead{font-size:clamp(17px,1.8vw,21px);max-width:60ch;opacity:.95;margin-top:8px}
.detail .nav{display:flex;gap:8px}
.detail .nav button{border:0;border-radius:999px;padding:10px 16px;font-weight:900;background:#ffffff2e;color:#fff}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--bg);color:var(--ink);border-radius:18px;overflow:hidden}
.card summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.card summary::-webkit-details-marker{display:none}
.card .k{font-weight:900;font-size:13px;border-radius:8px;padding:2px 7px;color:#fff;align-self:start}
.card .h{font-weight:900;font-size:17px;line-height:1.15}
.card .s{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:2px}
.card .plus{font-weight:900;font-size:20px;line-height:1;transition:transform .2s}
.card[open] .plus{transform:rotate(45deg)}
.card .body{padding:0 16px 16px 16px;display:grid;gap:8px;font-size:15px}
.card .body ul{margin:0;padding-left:18px;display:grid;gap:4px}
.card .body .ex{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:14px}
.card .body .ex b{font-weight:800}
.card .body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--soft);border-radius:6px;padding:1px 6px;word-break:break-all}

/* outline */
.outline{display:grid;gap:14px}
.ob{border-radius:22px;background:var(--soft);padding:18px 20px;display:grid;gap:10px}
.ob .oh{display:flex;gap:12px;align-items:center}
.ob .dot{width:18px;height:18px;border-radius:50%;flex:none}
.ob h3{font-weight:900;text-transform:uppercase;font-size:22px}
.ob ol{margin:0;padding-left:22px;display:grid;gap:6px;columns:2;column-gap:28px}
.ob li{break-inside:avoid;font-size:15px}
.ob li b{font-weight:800}
.ob li span{color:var(--muted)}

.c-rosa{background:var(--rosa)}.c-vermelho{background:var(--vermelho)}.c-lilas{background:var(--lilas)}.c-azul{background:var(--azul)}.c-ink{background:#1b1b1b}.c-verde{background:var(--verde)}.c-laranja{background:var(--laranja)}

@media (max-width:1000px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.map{display:none}.stack{display:grid}.ob ol{columns:1}}
@media (max-width:560px){.cards{grid-template-columns:1fr}.stack{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=s=>document.querySelector(s);
const map=$("#map"),svg=$("#lines"),stack=$("#stack");let cur=0;
// ring positions (percent of map box)
const POS=B.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/B.length;return [50+39*Math.cos(a),50+38*Math.sin(a)]});
B.forEach((b,i)=>{
  const mk=()=>{const n=document.createElement('button');n.className='node c-'+b.col;n.setAttribute('aria-pressed',i===cur);
    n.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${b.t}</span><span class="c">${b.c}</span>`;n.onclick=()=>select(i,true);return n};
  const a=mk();a.style.left=POS[i][0]+'%';a.style.top=POS[i][1]+'%';a.dataset.i=i;map.appendChild(a);
  const s=mk();s.dataset.i=i;stack.appendChild(s);
});
function draw(){const r=map.getBoundingClientRect();if(!r.width)return;svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
  const cx=r.width/2,cy=r.height/2;svg.innerHTML=B.map((b,i)=>{const x=POS[i][0]/100*r.width,y=POS[i][1]/100*r.height;const mx=(cx+x)/2,my=(cy+y)/2;const qx=mx+(y-cy)*.12,qy=my-(x-cx)*.12;
  return `<path class="${i===cur?'on':''}" stroke="${COL[b.col]}" d="M${cx},${cy} Q${qx},${qy} ${x},${y}"/>`}).join('')}
function select(i,scroll){cur=i;document.querySelectorAll('.node').forEach(n=>n.setAttribute('aria-pressed',+n.dataset.i===i));draw();
  const b=B[i];const d=$("#detail");d.style.background=COL[b.col];
  d.innerHTML=`<div class="head"><div><div class="tag" style="color:#ffffffcc">${String(i+1).padStart(2,'0')} / ${String(B.length).padStart(2,'0')}</div><h2>${b.t}</h2><p class="lead">${b.lead}</p></div>
  <div class="nav"><button id="pv" aria-label="Tema anterior">←</button><button id="nx" aria-label="Próximo tema">→</button><button id="ex">Abrir todos</button></div></div>
  <div class="cards">${b.items.map(([k,h,s,li,ex])=>`<details class="card"><summary><span class="k" style="background:${COL[b.col]}">${k}</span><span><span class="h">${h}</span><span class="s">${s}</span></span><span class="plus">+</span></summary><div class="body"><ul>${li.map(x=>`<li>${x}</li>`).join('')}</ul>${ex?`<div class="ex">${ex}</div>`:''}</div></details>`).join('')}</div>`;
  $("#pv").onclick=()=>select((i-1+B.length)%B.length,false);$("#nx").onclick=()=>select((i+1)%B.length,false);
  $("#ex").onclick=()=>{const all=[...d.querySelectorAll('details')];const open=all.some(x=>!x.open);all.forEach(x=>x.open=open);$("#ex").textContent=open?'Fechar todos':'Abrir todos'};
  if(scroll)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
new ResizeObserver(draw).observe(map);select(0,false);

/* outline */
$("#allView").innerHTML=B.map((b,i)=>`<div class="ob"><div class="oh"><span class="dot" style="background:${COL[b.col]}"></span><h3>${i+1}. ${b.t}</h3></div><p style="color:var(--muted)">${b.lead}</p><ol>${b.items.map(([k,h,s,li])=>`<li><b>${h}</b> <span>· ${s}</span><br>${li.join(' · ')}</li>`).join('')}</ol></div>`).join('');
function mode(m){$("#mMap").setAttribute('aria-pressed',m==='map');$("#mAll").setAttribute('aria-pressed',m==='all');$("#mapView").hidden=m!=='map';$("#allView").hidden=m!=='all';if(m==='map')requestAnimationFrame(draw)}
$("#mMap").onclick=()=>mode('map');$("#mAll").onclick=()=>mode('all');
document.addEventListener('keydown',e=>{if($("#mapView").hidden)return;if(e.target.closest('summary'))return;if(e.key==='ArrowRight')select((cur+1)%B.length,false);if(e.key==='ArrowLeft')select((cur-1+B.length)%B.length,false)});
</script>

</body></html>
